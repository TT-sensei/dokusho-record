<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>読書レコード</title>
<meta name="description" content="読んだ本を記録して、自分の読書の積み重ねを振り返る読書記録アプリ。">
<meta name="theme-color" content="#efe6d2">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icons/icon-180.png">
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
<a class="skip-link" href="#app">本文へ移動</a>

<div class="rr-shell">
  <header class="rr-header">
    <p class="rr-header__title">読書レコード</p>
  </header>

  <nav class="rr-nav" aria-label="画面切り替え">
    <button type="button" class="rr-nav-btn" data-route="shelf">
      <span class="rr-nav-btn__icon" aria-hidden="true">📚</span><span class="rr-nav-btn__label">本棚</span>
    </button>
    <button type="button" class="rr-nav-btn" data-route="add">
      <span class="rr-nav-btn__icon" aria-hidden="true">➕</span><span class="rr-nav-btn__label">本を登録</span>
    </button>
    <button type="button" class="rr-nav-btn" data-route="settings">
      <span class="rr-nav-btn__icon" aria-hidden="true">⚙️</span><span class="rr-nav-btn__label">設定</span>
    </button>
  </nav>

  <main id="app" class="rr-main" aria-live="polite">
    <!-- ここに各画面が描画されます(js/app.js) -->
  </main>
</div>

<div id="modal-root" class="rr-modal-root"></div>
<div id="toast-root" class="rr-toast-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js" defer></script>

<script src="./js/stats.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/books.js"></script>
<script src="./js/imagestore.js"></script>
<script src="./js/isbn-search.js"></script>
<script src="./js/barcode.js"></script>
<script src="./js/camera.js"></script>
<script src="./js/backup.js"></script>
<script src="./js/ui-common.js"></script>
<script src="./js/views/shelf.js"></script>
<script src="./js/views/add.js"></script>
<script src="./js/views/settings.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
